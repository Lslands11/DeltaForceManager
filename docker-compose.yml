services:
  # =============================================
  # MinIO 对象存储
  # =============================================
  minio:
    image: minio/minio:latest
    container_name: deltaforce-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - deltaforce-net

  # =============================================
  # 后端 (Spring Boot + Tesseract OCR)
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: deltaforce-backend
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-kskblzdjdwkzkbl}
      JWT_SECRET: ${JWT_SECRET:-DeltaForceManagerJwtSecretKey2024PleaseChangeInProduction}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8080:8080"
    depends_on:
      - minio
    networks:
      - deltaforce-net

  # =============================================
  # 前端 (Nginx)
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deltaforce-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - deltaforce-net

volumes:
  minio_data:
    driver: local

networks:
  deltaforce-net:
    driver: bridge
